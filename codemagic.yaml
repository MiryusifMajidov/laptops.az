# ============================================================================
# Codemagic CI — Laptops.az Flutter iOS → App Store (TestFlight)
# Mac lazım deyil; build buludda macOS maşınında olur, Windows-dan idarə edilir.
#
# İşə düşməzdən əvvəl Codemagic UI-da HAZIRLA:
#   1) Bu repo-nu Codemagic-ə qoş (GitHub).
#   2) App Store Connect API açarı yarat (appstoreconnect.apple.com →
#      Users and Access → Integrations → App Store Connect API) və onu
#      Codemagic → Teams → Integrations → App Store Connect-ə əlavə et.
#      İnteqrasiyanın ADINI aşağıdakı `app_store_connect:` dəyəri ilə eyni et
#      (indi: laptops_az_asc_key).
#   3) App Store Connect-də app record yarat — Bundle ID: az.laptops.laptopsAz
#
# Flutter tətbiqi repo kökündə deyil, `mobile/` qovluğundadır → working_directory.
# ============================================================================
workflows:
  ios-appstore:
    name: iOS · App Store (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: mobile
    integrations:
      app_store_connect: laptops_az_asc_key   # ← Codemagic-dəki API key inteqrasiyasının ADI
    # master/apk-build-ə push olunanda Codemagic webhook-u build-i özü işə salır
    # (UI-da "Start new build" lazım deyil; webhook qurulmayıbsa əl ilə başlat).
    # QEYD: `when:` buraya (triggering-in içinə) QOYULMUR — Codemagic
    # "extra fields not permitted" validasiya xətası verir. Yol filtri lazım olsa
    # workflow səviyyəsində ayrıca `when:` açarı kimi yazılmalıdır.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: apk-build
          include: true
          source: true
    environment:
      flutter: stable                          # lazım olsa dəqiq versiyaya pin et
      xcode: latest
      cocoapods: default
    scripts:
      # Kod imzalama — sertifikat + provisioning profili API key ilə YARADILIR
      # (təzə Apple hesabında hələ yoxdur; --create onları özü yaradır).
      - name: Keychain hazırla
        script: keychain initialize
      - name: Sertifikat + provisioning profili yarat/gətir
        script: |
          # Hər build təzə RSA açar yaradır → təzə distribution sertifikatı lazım olur.
          # Apple-ın distribution sertifikat limiti (2-3) dolanda Apple 409 qaytarır və
          # build dayanırdı (əvvəl developer.apple.com-dan ƏL İLƏ revoke edilirdi).
          # Aşağıdaki fallback onu avtomatlaşdırır: köhnə sertifikatların private key-i
          # onsuz da bizdə yoxdur (hər dəfə atılan açar) → istifadəsizdirlər, ləğv etmək
          # təhlükəsizdir və App Store-da olan buraxılışlara təsir etmir.
          # Codemagic-də CERTIFICATE_PRIVATE_KEY env dəyişəni varsa — HƏMİŞƏ eyni sertifikat
          # işlədilir və Apple-ın distribution limiti (409) bir daha dolmur.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Sabit imzalama açarı işlədilir (CERTIFICATE_PRIVATE_KEY)."
            KEY_ARG="--certificate-key=@env:CERTIFICATE_PRIVATE_KEY"
          else
            echo "Sabit açar yoxdur — bu build üçün müvəqqəti açar yaradılır."
            openssl genrsa -out /tmp/cert_key.pem 2048
            KEY_ARG="--certificate-key=@file:/tmp/cert_key.pem"
          fi
          fetch_signing() {
            app-store-connect fetch-signing-files "az.laptops.laptopsAz" \
              --type IOS_APP_STORE $KEY_ARG --create
          }
          if ! fetch_signing; then
            echo "!! İmzalama faylları alınmadı — ehtimal 409 (sertifikat limiti)."
            echo "   Mövcud distribution sertifikatlarının private key-i bizdə yoxdur (hər build atılan açar yaradırdı),"
            echo "   yəni onlar istifadəsizdir — ləğv edilir. Mağazadakı buraxılışlara təsir etmir."
            rm -f /tmp/cert_ids.txt
            # DİQQƏT: düzgün parametrlər --type və --ignore-not-found-dur
            # (--certificate-type / --yes YOXDUR; səhv yazılsa komanda susmadan xəta verir).
            for t in IOS_DISTRIBUTION DISTRIBUTION; do
              app-store-connect certificates list --type "$t" --json > /tmp/certs.json || true
              grep -o '"id"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/certs.json \
                | sed 's/.*"\([^"]*\)"$/\1/' >> /tmp/cert_ids.txt || true
            done
            sort -u /tmp/cert_ids.txt | head -5 > /tmp/cert_ids_uniq.txt
            echo "   tapılan sertifikatlar: $(tr '\n' ' ' < /tmp/cert_ids_uniq.txt)"
            while read -r cid; do
              [ -n "$cid" ] || continue
              if app-store-connect certificates delete "$cid" --ignore-not-found; then
                echo "   ləğv edildi: $cid"
              else
                echo "   ləğv ALINMADI: $cid"
              fi
            done < /tmp/cert_ids_uniq.txt
            # təkrar cəhd — limit boşaldıqdan sonra
            fetch_signing
          fi
      - name: Sertifikatı keychain-ə əlavə et
        script: keychain add-certificates
      - name: Xcode imzalamasını qur
        script: xcode-project use-profiles
      - name: Flutter pub get
        script: flutter pub get
      - name: CocoaPods install
        script: cd ios && pod install
      - name: Signed IPA build et
        script: flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true             # TestFlight beta-ya yüklə (sonra App Store-a promote)
