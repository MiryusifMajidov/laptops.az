name: laptops_az
description: "Laptops.az — müştəri mobil tətbiqi (iOS + Android)"
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  audioplayers: ^6.1.0
  share_plus: ^13.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-trim.png
    - assets/logo-white.png
    - assets/logo-mark.png
    - assets/notif.wav
