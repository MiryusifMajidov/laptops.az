# Laptops.az — Fly.io konfiqurasiyası
# App adını dəyişmək istəsən (məs. ad tutulubsa): aşağıdakı "app" sətrini dəyiş.
app = "laptops-az"
primary_region = "fra"   # Frankfurt (Azərbaycana yaxın Avropa mərkəzi)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Yaddaş tavanı (2026-09-12 OOM-dan sonra): Go zibil yığıcısı 350MB-a yaxınlaşanda
  # sərtləşir və maşın (512MB) çökmür. Həmin gün proses 412MB-a çatıb öldürülmüşdü.
  GOMEMLIMIT = "350MiB"

# Kalıcı disk — bütün data (laptops.db + şəkillər) burada saxlanır, deploy-larda İTMİR.
[[mounts]]
  source = "laptops_data"
  destination = "/data"
  # avtomatik genişlənmə: 90% dolanda (~500MB qalanda) 5GB artır, maksimum 10GB
  auto_extend_size_threshold = 90
  auto_extend_size_increment = "5GB"
  auto_extend_size_limit = "10GB"

[http_service]
  internal_port = 8080
  force_https = true            # http → https avtomatik
  # Xərcə görə (2026-09-12): boş qalanda maşın dayanır, sorğu gələndə özü oyanır.
  # Go binary olduğu üçün oyanma ~1-2 saniyədir (Next.js kimi 30s deyil).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
